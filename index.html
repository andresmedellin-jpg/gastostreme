<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Treme / MEDCO</title>
  <meta name="theme-color" content="#F4F3EF">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icono-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
  <link rel="apple-touch-icon" href="img/icono-apple.png">
  <meta name="apple-mobile-web-app-title" content="Treme / MEDCO">
  <meta name="color-scheme" content="light only">
  <link rel="stylesheet" href="css/app.css?v=20261105-1837">
  <link rel="stylesheet" href="css/ejecutivo.css?v=20261105-1837">
</head>
<body>
  <!-- Pantalla de acceso -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="login-logos"></div>
      <p class="login-sub">Inicia sesión con tu usuario</p>
      <form id="login-form" autocomplete="on">
        <label>Usuario
          <input type="text" id="login-user" required autocomplete="username" autocapitalize="none"
                 autocorrect="off" spellcheck="false" placeholder="tu usuario">
        </label>
        <label>Contraseña
          <input type="password" id="login-pass" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
        <button type="button" class="link-btn" id="login-olvide">¿Olvidaste tu contraseña?</button>
        <p class="login-msg" id="login-msg" role="status"></p>
      </form>
    </div>
  </section>

  <!-- Aplicación -->
  <div id="shell" class="shell" hidden>
    <!-- Barra superior: marca, los tres mundos (Grupo · Treme · MEDCO), fecha y usuario; abajo, las pestañas del mundo -->
    <header class="mx-top">
      <div class="mx-fila">
        <div class="brand mx-marca"></div>
        <nav class="mx-mundos" id="mundos" aria-label="Empresa"></nav>
        <div class="mx-der">
          <span class="top-fecha" id="top-fecha"></span>
          <div class="user" id="user-box"></div>
          <button class="btn btn-ghost btn-sm" id="logout">Salir</button>
        </div>
      </div>
      <nav id="nav" class="mx-tabs" aria-label="Secciones"></nav>
    </header>
    <div class="main">
      <div class="topbar">
        <div class="top-tit"><span class="top-eyebrow" id="page-eyebrow"></span><h1 id="page-title">—</h1></div>
        <div class="topbar-actions" id="page-actions"></div>
      </div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="importmap">
  { "imports": {
    "./js/app.js": "./js/app.js?v=20261105-1837",
    "./js/config.js": "./js/config.js?v=20261105-1837",
    "./js/recibo.js": "./js/recibo.js?v=20261105-1837",
    "./js/lib.js": "./js/lib.js?v=20261105-1837",
    "./js/modulos/gastos.js": "./js/modulos/gastos.js?v=20261105-1837",
    "./js/modulos/usuarios.js": "./js/modulos/usuarios.js?v=20261105-1837",
    "./js/modulos/personal.js": "./js/modulos/personal.js?v=20261105-1837",
    "./js/modulos/rentas.js": "./js/modulos/rentas.js?v=20261105-1837",
    "./js/modulos/cobranza.js": "./js/modulos/cobranza.js?v=20261105-1837",
    "./js/modulos/inicio.js": "./js/modulos/inicio.js?v=20261105-1837",
    "./js/modulos/patrimonio.js": "./js/modulos/patrimonio.js?v=20261105-1837",
    "./js/modulos/obras.js": "./js/modulos/obras.js?v=20261105-1837",
    "./js/modulos/reportes.js": "./js/modulos/reportes.js?v=20261105-1837",
    "./js/modulos/inventario.js": "./js/modulos/inventario.js?v=20261105-1837",
    "./js/modulos/cotizaciones.js": "./js/modulos/cotizaciones.js?v=20261105-1837",
    "./js/modulos/prospectos.js": "./js/modulos/prospectos.js?v=20261105-1837",
    "./js/modulos/importar.js": "./js/modulos/importar.js?v=20261105-1837",
    "./js/modulos/lecturas.js": "./js/modulos/lecturas.js?v=20261105-1837",
    "./js/modulos/equipo.js": "./js/modulos/equipo.js?v=20261105-1837",
    "./js/modulos/turno.js": "./js/modulos/turno.js?v=20261105-1837",
    "./js/cotizacion-pdf.js": "./js/cotizacion-pdf.js?v=20261105-1837",
    "./js/modulos/pendiente.js": "./js/modulos/pendiente.js?v=20261105-1837"
  } }
  </script>
  <script>
    // Con ?demo=medco la plataforma corre con datos de ejemplo en memoria (js/demo/), sin conectarse a la base real.
    // (Los demos de Unaria viven en unaria.mx/demo, no aquí.)
    if (/[?&]demo=medco\b/i.test(location.search)) {
      document.write('<script src="./js/demo/datos-demo.js?v=20261105-1837"><\/script><script src="./js/demo/supabase-demo.js?v=20261105-1837"><\/script>');
    } else {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');
    }
  </script>
  <script type="module" src="./js/app.js?v=20261105-1837"></script>
</body>
</html>
