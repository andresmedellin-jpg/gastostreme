<!doctype html>
<!-- Página pública para que un residente reporte algo con el QR del elevador (sin cuenta).
     app.medco.mx/reportar.html?c=<id del edificio>. Solo puede crear el reporte (función reporte_residente). -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportar algo</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --p: #2F6B4F; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.45 Arial, Helvetica, sans-serif; background: #f6f5f2; color: #151515; }
    .c { max-width: 460px; margin: 0 auto; padding: 22px 16px 40px; }
    .hd { background: var(--p); color: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .hd h1 { margin: 0 0 4px; font-size: 22px; } .hd p { margin: 0; opacity: .9; }
    form { background: #fff; border: 1px solid #e8e6e1; border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
    input, textarea, select { font: inherit; padding: 12px; border: 1px solid #d9d6cf; border-radius: 10px; width: 100%; background: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { border: 1px solid #d9d6cf; background: #fff; border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    .chips button.on { background: var(--p); color: #fff; border-color: var(--p); }
    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { height: 52px; border: 0; border-radius: 12px; background: var(--p); color: #fff; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; }
    .btn:disabled { opacity: .6; }
    .msg { color: #b42318; font-size: 14px; min-height: 1em; }
    .ok { text-align: center; background: #fff; border-radius: 14px; padding: 30px 20px; border: 1px solid #e8e6e1; }
    .ok b { font-size: 40px; color: var(--p); display: block; }
    small { color: #8b8b8b; font-weight: 400; }
  </style>
</head>
<body>
  <div class="c" id="app"><p>Cargando…</p></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // Treme / MEDCO: la base y el color de app.medco.mx
    window.REPORTAR_DEFECTO = { supabaseUrl: 'https://mqzuaxxnidaokhdqcurm.supabase.co', supabaseKey: 'sb_publishable_y1lW-QidgXb4LoVtqoC2rw_5Oj4GpKJ', marca: { color: '#a21d21' } };
    (function () {
      var q = new URLSearchParams(location.search), cliente = (q.get('cliente') || '').replace(/[^a-z0-9-]/g, ''), centro = q.get('c') || '';
      var app = document.getElementById('app');
      var falla = function (t) { app.innerHTML = '<div class="ok"><p>' + t + '</p></div>'; };
      if (!/^[0-9a-f-]{36}$/.test(centro)) return falla('Este código no es válido. Pide ayuda en caseta.');
      // Sin cliente: la instalación propia de esta página (REPORTAR_DEFECTO), si tiene
      if (!cliente) { if (!window.REPORTAR_DEFECTO) return falla('Este código no es válido. Pide ayuda en caseta.'); window.__CLIENTE = window.REPORTAR_DEFECTO; return iniciar(); }
      var s = document.createElement('script');
      s.src = 'clientes/' + cliente + '.js';
      s.onerror = function () { falla('Este código no es válido. Pide ayuda en caseta.'); };
      s.onload = iniciar;
      document.head.appendChild(s);

      function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      async function iniciar() {
        if (iniciar.ya) return; iniciar.ya = true;
        var C = window.__CLIENTE; if (!C || !C.supabaseUrl) return falla('Este código no es válido.');
        if (C.marca && C.marca.color) document.documentElement.style.setProperty('--p', C.marca.color);
        var db = window.supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession: false } }).schema('app');
        var r = await db.rpc('centro_publico', { p_centro: centro });
        if (r.error || !r.data) return falla('Este código no es válido. Pide ayuda en caseta.');
        var edificio = r.data, tipos = ['Fuga de agua', 'Luz', 'Elevador', 'Limpieza', 'Ruido', 'Seguridad', 'Otro'], tipo = '';
        app.innerHTML = '<div class="hd"><h1>¿Algo no funciona?</h1><p>Avísale a la administración de <b>' + esc(edificio) + '</b>.</p></div>' +
          '<form id="f"><label>¿Qué pasa?<div class="chips">' + tipos.map(function (t) { return '<button type="button" data-t="' + t + '">' + t + '</button>'; }).join('') + '</div></label>' +
          '<label>Cuéntanos <textarea name="d" rows="3" maxlength="900" required placeholder="Ej. sale agua debajo del lavabo"></textarea></label>' +
          '<div class="dos"><label>Tu depto<input name="u" maxlength="20" required placeholder="D305"></label><label>Tu nombre <small>(opcional)</small><input name="n" maxlength="60"></label></div>' +
          '<label>Tu celular <small>(para avisarte cuando quede)</small><input name="t" maxlength="20" inputmode="tel"></label>' +
          '<div class="msg" id="m"></div><button class="btn" id="b">Enviar reporte</button></form>';
        var f = document.getElementById('f');
        f.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { tipo = b.dataset.t; f.querySelectorAll('[data-t]').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
        f.onsubmit = async function (e) {
          e.preventDefault();
          var m = document.getElementById('m'), b = document.getElementById('b');
          if (!f.d.value.trim()) { m.textContent = 'Cuéntanos qué pasa.'; return; }
          if (!f.u.value.trim()) { m.textContent = 'Escribe tu depto.'; return; }
          b.disabled = true; m.textContent = '';
          var res = await db.rpc('reporte_residente', { p_centro: centro, p_unidad: f.u.value.trim().toUpperCase(), p_nombre: f.n.value.trim(), p_telefono: f.t.value.trim(),
            p_descripcion: (tipo ? tipo + ': ' : '') + f.d.value.trim() });
          if (res.error) { b.disabled = false; m.textContent = res.error.message.indexOf('Intenta') >= 0 ? 'Hay muchos reportes en este momento. Intenta en un rato o avisa en caseta.' : 'No se pudo enviar. Intenta de nuevo o avisa en caseta.'; return; }
          app.innerHTML = '<div class="ok"><b>✓</b><h2>Recibimos tu reporte</h2><p>La administración de ' + esc(edificio) + ' ya lo tiene.' + (f.t.value.trim() ? ' Te avisamos cuando quede.' : '') + '</p></div>';
        };
      }
    })();
  </script>
</body>
</html>
