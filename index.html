<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plataforma · Treme · MEDCO</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Pantalla de acceso -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand"><span class="brand-mark">▲</span> Plataforma</div>
      <p class="login-sub">Treme · MEDCO</p>
      <form id="login-form" autocomplete="on">
        <label>Correo
          <input type="email" id="login-email" required autocomplete="email" placeholder="tu@correo.com">
        </label>
        <label>Contraseña
          <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
        <button type="button" class="btn btn-ghost btn-block" id="login-link">Mandarme un enlace al correo</button>
        <p class="login-msg" id="login-msg" role="status"></p>
      </form>
    </div>
  </section>

  <!-- Aplicación -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">▲</span> Plataforma</div>
      <nav id="nav" class="nav" aria-label="Módulos"></nav>
      <div class="sidebar-foot">
        <div class="user" id="user-box"></div>
        <button class="btn btn-ghost btn-sm" id="logout">Salir</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Menú">☰</button>
        <h1 id="page-title">—</h1>
        <div class="topbar-actions" id="page-actions"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
